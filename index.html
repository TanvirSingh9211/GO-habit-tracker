<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Go - a habit tracker</title>
</head>

<body>
    <div class="heading">
        <h1>GO - Habit Tracker</h1>
    </div>

    <h4>Current Habits :</h4>
    <div class="container">
        <p id="habitplaceholder"></p>
        <div id="habitlist"></div>
    </div>

    <div class="add-sec">
        <label for="form">Add a habit : </label>
        <p id="verifymsg" class="not-verified-msg"></p>
        <input type="text" id="form" class="form" name="add"> <button id="addbtn" class="btn push-btn">save</button>
    </div>

    <span class="prog">progress</span>
    <div id="outerPB">
        <div id="innerPB"></div>
    </div>
    
    <script type="module" src="script.js"></script>
</body>

</html>
