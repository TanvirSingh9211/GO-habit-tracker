<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Go - a habit tracker</title>
</head>

<body>
    <div class="heading-container">
        <div class="heading">GO - Habit Tracker</div>
         <!-- <h1>Go - Habit Tracker</h1> -->
        <button class="theme-btn themeToggle"></button>
        
    </div>

    <h4>Current Habits :</h4>
    <div class="container">
        <p id="habitplaceholder"></p>
        <div id="habitlist"></div>
    </div>

    <div class="addHab">
        <label for="form">Add a habit : </label>
        <p id="errormsg" class="error-msg"></p>
        <input type="text" id="form" class="form"> <button id="addbtn" class="btn push-btn">save</button>
    </div>

    <span class="prog">progress</span>
    <div id="outerPB">
        <div id="innerPB"></div>
    </div>

    <div class="heat-map-container">
        <button class="btn prev"></button>
        <div id="heatmap" class="heat-map">
            <div class="legend-container">
                <span title="0 habit">less</span>
                <div id="legend"></div>
                <span title="4 or more habits">more</span>
            </div>  
        </div>
        <button class="btn next"></button>
    </div>
    
    <script type="module" src="script.js"></script>
</body>

</html>
