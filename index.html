<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Go - a habit tracker</title>
</head>

<body>
    <div class="heading">
        <h1>GO - Habit Tracker</h1>
    </div>

    <div class="habit-container">
        <h4>Current Habits :</h4>
        <p id="habitplaceholder"></p>
        <ul id="habitlist"></ul>
    </div>

    <div class="form-container">
        <p>Add a habit : </p>
        <input type="text" id="form"> <button onclick=addHabits() class="btn push-btn">save</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
