<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO - habit tracker(signup)</title>
    <link rel="stylesheet" href="signup.css">
    <script src="signup.js" defer></script>
</head>
<body>
    <div class ="form-container">
        <header>Sign Up</header>
        <div class="errormsg-container">
            <p id="errormsg"></p>
        </div>

        <form id="userForm">
            
            <input type="text" name="username" id="name" placeholder="Enter your name" required>
            <input type="number" name="age" id="age" placeholder="Enter your age" required>
            <input type="email" name="email" id="email" placeholder="Enter your email">
            <div class="pass-container">
            <input type="password" name="password" id="password" placeholder="Create a password" required>
            <button id="passbtn" type="button" class="material-icons pass-btn">visibility_off</button>
            </div>
            <input type="password" id="confirm" placeholder="Confirm password">
            <button type="submit"  class="submit-btn">sign up</button>
            
        </form>
        <div class="success-container">
            <p id="successmsg"></p>
        </div>


    </div>
    
</body>
</html>
