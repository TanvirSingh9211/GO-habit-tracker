<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO - habit tracker(signup)</title>
    <link rel="stylesheet" href="signup.css">
    <script src="signup.js" defer></script>
</head>
<body>
    <div class ="form-container">
        <header>Sign Up</header>

        <form id="userForm">
            <p style="margin-bottom: 2rem; height: 5px ;"></p>
            <input type="text" name="username" id="name" placeholder="Enter your name" required>
            <input type="number" name="age" min="1" max="100" placeholder="Enter your age" required>
            <input type="email" name="email" placeholder="Enter your email">
            <input type="password" name="password" placeholder="Create a password" required>
            <input type="password" placeholder="Confirm password">
            <button type="submit"  class="submit-btn">sign in</button>
            
        </form>

    </div>
    
</body>
</html>
